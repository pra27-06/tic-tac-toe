<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="babyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0f5"/>
      <stop offset="50%" stop-color="#f8edff"/>
      <stop offset="100%" stop-color="#e8f4fd"/>
    </linearGradient>
    <linearGradient id="kBabyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7597"/>
      <stop offset="100%" stop-color="#ff5277"/>
    </linearGradient>
    <linearGradient id="zBabyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="babyShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#b89ac2" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Background Soft Rounded Badge -->
  <rect x="6" y="6" width="88" height="88" rx="26" fill="url(#babyBg)" stroke="#ffffff" stroke-width="3" filter="url(#babyShadow)"/>

  <!-- Cute Baby Kata on Left -->
  <g transform="translate(14, 22) scale(0.48)">
    <line x1="15" y1="15" x2="65" y2="65" stroke="url(#kBabyGrad)" stroke-width="16" stroke-linecap="round"/>
    <line x1="65" y1="15" x2="15" y2="65" stroke="url(#kBabyGrad)" stroke-width="16" stroke-linecap="round"/>
    <!-- Baby Face -->
    <circle cx="40" cy="40" r="16" fill="#fff5ea"/>
    <path d="M 40 24 Q 43 20 38 18 Q 35 22 40 24" fill="#c48a56"/>
    <circle cx="34" cy="38" r="2.6" fill="#373244"/>
    <circle cx="46" cy="38" r="2.6" fill="#373244"/>
    <circle cx="33" cy="37" r="1" fill="#ffffff"/>
    <circle cx="45" cy="37" r="1" fill="#ffffff"/>
    <ellipse cx="30" cy="43" rx="3" ry="1.5" fill="#ff7597" opacity="0.8"/>
    <ellipse cx="50" cy="43" rx="3" ry="1.5" fill="#ff7597" opacity="0.8"/>
    <ellipse cx="40" cy="45" rx="4.5" ry="3" fill="#ff7597"/>
    <circle cx="40" cy="45" r="1.8" fill="#ffffff"/>
  </g>

  <!-- Cute Baby Zero on Right -->
  <g transform="translate(48, 22) scale(0.48)">
    <circle cx="40" cy="40" r="26" stroke="url(#zBabyGrad)" stroke-width="14" fill="none"/>
    <path d="M 28 16 Q 40 8 52 16 Q 40 12 28 16 Z" fill="#60a5fa"/>
    <circle cx="40" cy="8" r="3" fill="#fde047"/>
    <!-- Baby Face -->
    <circle cx="40" cy="40" r="16" fill="#fff5ea"/>
    <path d="M 40 24 Q 37 20 42 18 Q 45 22 40 24" fill="#c48a56"/>
    <circle cx="34" cy="38" r="2.6" fill="#373244"/>
    <circle cx="46" cy="38" r="2.6" fill="#373244"/>
    <circle cx="33" cy="37" r="1" fill="#ffffff"/>
    <circle cx="45" cy="37" r="1" fill="#ffffff"/>
    <ellipse cx="30" cy="43" rx="3" ry="1.5" fill="#ff7675" opacity="0.8"/>
    <ellipse cx="50" cy="43" rx="3" ry="1.5" fill="#ff7675" opacity="0.8"/>
    <ellipse cx="40" cy="45" rx="4.5" ry="3" fill="#38bdf8"/>
    <circle cx="40" cy="45" r="1.8" fill="#ffffff"/>
  </g>

  <!-- Baby Rattle / Sparkle Accent -->
  <path d="M 50 74 Q 52 78 56 79 Q 52 80 50 84 Q 49 80 45 79 Q 49 78 50 74 Z" fill="#ffd166"/>
</svg>
