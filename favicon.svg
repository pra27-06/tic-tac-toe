<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="gtaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140727"/>
      <stop offset="50%" stop-color="#0a0314"/>
      <stop offset="100%" stop-color="#05081c"/>
    </linearGradient>
    <linearGradient id="neonPinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#ff5277"/>
    </linearGradient>
    <linearGradient id="neonCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#00a8ff"/>
    </linearGradient>
    <filter id="neonGlowFav" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ff007f" flood-opacity="0.8"/>
    </filter>
    <filter id="cyanGlowFav" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00f0ff" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Dark Metallic Background Badge -->
  <rect x="5" y="5" width="90" height="90" rx="22" fill="url(#gtaBg)" stroke="#ff007f" stroke-width="2.5"/>

  <!-- Neon Kata (Cross) on Left -->
  <g transform="translate(13, 23) scale(0.46)" filter="url(#neonGlowFav)">
    <line x1="16" y1="16" x2="68" y2="68" stroke="#ff007f" stroke-width="18" stroke-linecap="round"/>
    <line x1="68" y1="16" x2="16" y2="68" stroke="#ff007f" stroke-width="18" stroke-linecap="round"/>
    <line x1="16" y1="16" x2="68" y2="68" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
    <line x1="68" y1="16" x2="16" y2="68" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Neon Zero (Circle) on Right -->
  <g transform="translate(48, 23) scale(0.46)" filter="url(#cyanGlowFav)">
    <circle cx="42" cy="42" r="28" stroke="#00f0ff" stroke-width="18" fill="none"/>
    <circle cx="42" cy="42" r="28" stroke="#ffffff" stroke-width="8" fill="none"/>
  </g>

  <!-- GTA VI Roman Numeral VI Accent & Sunset Sun at Bottom -->
  <path d="M 38 78 L 44 90 L 50 78 M 56 78 L 56 90" stroke="#ffaa00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
