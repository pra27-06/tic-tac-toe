<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="hubBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0f5"/>
      <stop offset="50%" stop-color="#f5e8ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="padGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7597"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="hubShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#c084fc" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Soft Rounded Badge -->
  <rect x="6" y="6" width="88" height="88" rx="26" fill="url(#hubBg)" stroke="#ffffff" stroke-width="3" filter="url(#hubShadow)"/>

  <!-- Cute Game Controller in Center -->
  <g transform="translate(14, 22) scale(0.72)">
    <!-- Controller Body -->
    <rect x="5" y="14" width="90" height="52" rx="26" fill="url(#padGrad)" filter="url(#hubShadow)"/>
    <rect x="8" y="16" width="84" height="48" rx="24" fill="#ffffff" opacity="0.2"/>
    
    <!-- D-Pad on Left -->
    <rect x="22" y="32" width="16" height="16" rx="4" fill="#ffffff"/>
    <rect x="26" y="26" width="8" height="28" rx="3" fill="#ffffff"/>
    <rect x="16" y="36" width="28" height="8" rx="3" fill="#ffffff"/>
    
    <!-- Cute Blushing Face in Center of Controller -->
    <circle cx="46" cy="38" r="2.2" fill="#ffffff"/>
    <circle cx="54" cy="38" r="2.2" fill="#ffffff"/>
    <ellipse cx="43" cy="42" rx="2" ry="1.2" fill="#ff7597"/>
    <ellipse cx="57" cy="42" rx="2" ry="1.2" fill="#ff7597"/>
    <path d="M 47 41 Q 50 44 53 41" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" fill="none"/>

    <!-- Action Buttons on Right -->
    <circle cx="70" cy="32" r="4.5" fill="#fde047"/>
    <circle cx="80" cy="40" r="4.5" fill="#38bdf8"/>
    <circle cx="70" cy="48" r="4.5" fill="#4ade80"/>
    <circle cx="60" cy="40" r="4.5" fill="#ff7597"/>
  </g>

  <!-- Sparkle Accent -->
  <path d="M 50 78 Q 52 82 56 83 Q 52 84 50 88 Q 49 84 45 83 Q 49 82 50 78 Z" fill="#ffd166"/>
</svg>
