<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0f5"/>
      <stop offset="50%" stop-color="#f8edff"/>
      <stop offset="100%" stop-color="#e8f4fd"/>
    </linearGradient>
    <linearGradient id="kataGradFav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7597"/>
      <stop offset="100%" stop-color="#ff5277"/>
    </linearGradient>
    <linearGradient id="zeroGradFav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#b89ac2" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Background Rounded Badge -->
  <rect x="6" y="6" width="88" height="88" rx="26" fill="url(#bgGrad)" stroke="#ffffff" stroke-width="3" filter="url(#shadow)"/>

  <!-- Cute Smiling Kata on Left -->
  <g transform="translate(14, 22) scale(0.48)">
    <line x1="15" y1="15" x2="65" y2="65" stroke="url(#kataGradFav)" stroke-width="16" stroke-linecap="round"/>
    <line x1="65" y1="15" x2="15" y2="65" stroke="url(#kataGradFav)" stroke-width="16" stroke-linecap="round"/>
    <circle cx="40" cy="40" r="14" fill="#ffffff"/>
    <circle cx="35" cy="38" r="2.5" fill="#373244"/>
    <circle cx="45" cy="38" r="2.5" fill="#373244"/>
    <ellipse cx="32" cy="43" rx="2.5" ry="1.2" fill="#ff7597"/>
    <ellipse cx="48" cy="43" rx="2.5" ry="1.2" fill="#ff7597"/>
    <path d="M 37 42 Q 40 45 43 42" stroke="#373244" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Cute Smiling Zero on Right -->
  <g transform="translate(48, 22) scale(0.48)">
    <circle cx="40" cy="40" r="26" stroke="url(#zeroGradFav)" stroke-width="14" fill="none"/>
    <circle cx="40" cy="40" r="14" fill="#ffffff"/>
    <!-- Cute Ribbon Bow -->
    <path d="M 34 10 Q 40 14 40 16 Q 40 14 46 10 Q 44 17 40 16 Q 36 17 34 10 Z" fill="#ff7597"/>
    <circle cx="40" cy="15" r="2" fill="#ffd1dc"/>
    <circle cx="35" cy="38" r="2.5" fill="#373244"/>
    <circle cx="45" cy="38" r="2.5" fill="#373244"/>
    <ellipse cx="32" cy="43" rx="2.5" ry="1.2" fill="#ff7675"/>
    <ellipse cx="48" cy="43" rx="2.5" ry="1.2" fill="#ff7675"/>
    <path d="M 37 42 Q 40 45 43 42" stroke="#373244" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Little Golden Sparkle -->
  <path d="M 50 74 Q 52 78 56 79 Q 52 80 50 84 Q 49 80 45 79 Q 49 78 50 74 Z" fill="#ffd166"/>
</svg>
